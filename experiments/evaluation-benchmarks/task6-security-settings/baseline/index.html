<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DevShield Security Settings</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; max-width: 700px; margin: 0 auto; }
    .section { border-bottom: 1px solid #ccc; padding-bottom: 1.5rem; margin-bottom: 1.5rem; }
    .toggle { margin-bottom: 1rem; }
    .danger { background: #fee2e2; border: 1px solid #ef4444; padding: 1rem; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; }
    .modal-box { background: white; margin: 15% auto; padding: 2rem; width: 400px; }
  </style>
</head>
<body>
  <h1>DevShield Security Settings</h1>

  <div class="section">
    <h2>Two-Factor Authentication</h2>
    <div class="toggle">
      <input type="checkbox" id="2fa">
      <label for="2fa">Enforce 2FA for all organization members</label>
    </div>
  </div>

  <div class="section">
    <h2>Allowed IP Ranges</h2>
    <!-- Notice: input has no label or id linked via for/id -->
    <input type="text" placeholder="192.168.1.0/24">
    <div class="error" style="color: red;">Invalid CIDR notation</div>
  </div>

  <div class="section danger">
    <h2>Revoke API Keys</h2>
    <p>Revoking active tokens invalidates all ongoing CI/CD builds.</p>
    <!-- Notice: Dialog is nested inside aria-hidden modal overlay -->
    <button onclick="document.querySelector('.modal').style.display='block'">Revoke All Tokens</button>
  </div>

  <div class="actions">
    <button>Save Changes</button>
    <button>Cancel</button>
  </div>

  <div class="modal" aria-hidden="true">
    <div class="modal-box">
      <h3>Are you sure?</h3>
      <p>This action cannot be undone.</p>
      <button onclick="document.querySelector('.modal').style.display='none'">Confirm Revoke</button>
      <button onclick="document.querySelector('.modal').style.display='none'">Cancel</button>
    </div>
  </div>
</body>
</html>
